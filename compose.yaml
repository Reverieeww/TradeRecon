name: trade-recon
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: traderecon
      POSTGRES_USER: traderecon_migration
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/10-runtime-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traderecon_migration -d traderecon"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://db:5432/traderecon
      DB_USER: traderecon_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MIGRATION_USER: traderecon_migration
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:?Set MIGRATION_PASSWORD}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD with at least 12 characters}
      AI_MODE: ${AI_MODE:-OFF}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_LIVE_APPROVED: ${AI_LIVE_APPROVED:-false}
      AI_BUDGET_USD: ${AI_BUDGET_USD:-0}
      AI_INPUT_USD_PER_MILLION: ${AI_INPUT_USD_PER_MILLION:-0}
      AI_OUTPUT_USD_PER_MILLION: ${AI_OUTPUT_USD_PER_MILLION:-0}
      AI_MAX_REQUESTS: ${AI_MAX_REQUESTS:-0}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

