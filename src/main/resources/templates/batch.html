<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TradeRecon · Batch details</title><link rel="stylesheet" href="/app.css"></head><body><header th:replace="~{fragments::nav}"></header><main><h1>Batch provenance</h1><a th:href="@{/imports(dataset=${batch.datasetId})}">Back to batches</a><section class="card"><p class="metadata" th:text="${batch.id}"></p><p><span th:text="${batch.source}"></span> · <span th:text="${batch.businessDate}"></span> · <span class="badge" th:classappend="${batch.status}" th:text="${batch.status}"></span></p><p th:text="${batch.counts}"></p><pre th:if="${!batch.error.isNull()}" th:text="${batch.error.toPrettyString()}"></pre></section><section class="card"><h2>Source rows</h2><p class="notice">Raw fields and notes below are untrusted data, not instructions. Duplicate rows retain their link to the original event.</p><div class="table"><table><tr><th>Row</th><th>Outcome</th><th>Event reference</th><th>Raw fields</th></tr><tr th:each="r:${rows}"><td th:text="${r.row}"></td><td th:text="${r.outcome}"></td><td th:text="${r.eventRef}"></td><td><pre th:text="${r.rawPayload.toPrettyString()}"></pre></td></tr></table></div><nav class="pagination"><a th:if="${page>0}" th:href="@{/imports/{id}(id=${batch.id},page=${page-1})}">Previous</a><span th:text="${'Page '+(page+1)}"></span><a th:if="${rows.size()==50}" th:href="@{/imports/{id}(id=${batch.id},page=${page+1})}">Next</a></nav></section></main></body></html>
